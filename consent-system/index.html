<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI撮影許諾エージェント - 管理仕様デモ v0.7</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 老眼・現場の屋外でも読めるサイズに寄せています（出演者画面） */
    .performer-input {
      font-size: 20px !important;
      min-height: 56px;
      line-height: 1.45;
    }
    .performer-check {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .performer-ui .pf-header-title {
      font-size: 1.35rem !important;
      line-height: 1.3;
    }
    .performer-ui .pf-header-sub {
      font-size: 1.05rem !important;
      line-height: 1.4;
      margin-top: 2px;
    }
    .performer-ui .pf-bubble,
    .performer-ui .pf-body {
      font-size: 1.15rem !important;
      line-height: 1.65 !important;
    }
    .performer-ui .pf-label {
      font-size: 1.15rem !important;
      line-height: 1.4;
    }
    .performer-ui .pf-hint {
      font-size: 1.05rem !important;
      line-height: 1.5;
    }
    .performer-ui .pf-item {
      font-size: 1.1rem !important;
      line-height: 1.55 !important;
    }
    .performer-ui .pf-btn {
      font-size: 1.2rem !important;
      min-height: 56px;
    }
    .performer-ui .pf-items {
      max-height: none !important;
    }
    .performer-ui .pf-pre {
      font-size: 1.05rem !important;
      line-height: 1.7 !important;
    }
  </style>
</head>
<body class="bg-[#0F172A]">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

// 営業戦略のハイブリッド案（2026-07-20ロック）と同期しています
const PLANS = {
  '梅': { price: '¥19,800', maxLocs: 3, maxConsents: 50, line: false, desc: 'お試し・月50件／超過は追加パック' },
  '竹': { price: '¥39,800', maxLocs: 8, maxConsents: 200, line: false, desc: '本命・月200件／PDF・Drive想定' },
  '松': { price: '¥79,800', maxLocs: 999, maxConsents: 1000, line: true, desc: '月1000件・LINE・オートチャージ可' },
};

const ITEMS = [
  { key: 'item1', label: 'テレビ放送（地上波・BS・CS）および当該番組の再放送・再編集' },
  { key: 'item2', label: '当該番組の公式SNSでの広報（X、Instagram、YouTube、Facebook等）※インターネット経由のため、国外からも閲覧される場合があります' },
  { key: 'item3', label: '当該番組・許諾先のHP／アプリ／チラシ／ガイド誌等での広報' },
  { key: 'item4', label: '調査研究・番組コンクール等への出品' },
  { key: 'item5', label: '許諾先が管理する映像ライブラリーでの保管・社内参照' },
  { key: 'item6', label: '許諾先または関連団体が主催するイベントでの上映' },
  { key: 'item7', label: '見逃し配信・VOD等のオンデマンド配信※インターネット経由のため、国外からも閲覧される場合があります' },
  { key: 'item8', label: '許諾先制作の他番組での素材・部分利用' },
  { key: 'item9', label: '系列局・CATV・配信プラットフォーム等への番組／素材提供' },
  { key: 'item10', label: '出版・DVD・Blu-ray等のパッケージ化（無償の記録・頒布目的。有償の広告・商品利用は含みません）' },
];

const DEFAULT_NOTICE = `【ご注意・重要事項】
1. 放送日・配信日・公開範囲は、番組編成により変更される場合があります。
2. 本同意の内容は送信後に変更できません（誤記の場合はお問い合わせのうえ再提出をお願いします）。
3. 本同意の撤回を希望される場合は、下記お問い合わせ先までご連絡ください。ただし、すでに放送・公開済みの範囲については対応できない場合があります。
4. 18歳未満の方は、保護者の同意が必要です（該当する場合は保護者同伴でご記入ください）。
5. モザイク希望がある場合は、制作上可能な範囲で対応します（完全な非公開を保証するものではありません）。
6. 本同意に基づく出演料の支払いは原則ありません。
7. 公式SNS・見逃し配信等はインターネット経由のため、国外からも閲覧される場合があります（海外向け配給・海外放送権の譲渡は本同意の対象外です）。`;

function buildPreamble(loc) {
  const licensor =
    loc.licensorMode === 'company' ? loc.companyName :
    loc.licensorMode === 'program' ? loc.programName :
    `${loc.companyName}／${loc.programName}`;
  return `【肖像権・出演に関する同意】
私は、下記の許諾先に対し、本日撮影された映像・音声・写真について、下記チェック項目の範囲で利用することを同意します。

・許諾先：${licensor}
・撮影日：本日
・利用地域：日本国内（ただし公式SNS・見逃し配信等は、インターネット経由で国外からも閲覧される場合があります）
・対価：本同意に基づく出演料の支払いは原則ありません
・同意方法：下記項目は初期状態ですべて同意済みです。不同意の項目のみチェックを外してください`;
}

const ConsentSystemDemo = () => {
  const [activeTab, setActiveTab] = useState('admin');
  const [selectedPlan, setSelectedPlan] = useState('松');
  const [locations, setLocations] = useState([
    {
      id: 'loc1',
      name: '7/18 渋谷ロケ',
      licensorMode: 'both',
      companyName: '株式会社サンプル制作',
      programName: '街角ドキュメント',
      programNotice: '番組「街角ドキュメント」／お問い合わせ: seiyaku@example.com（平日10-18時）',
      noticeText: DEFAULT_NOTICE,
      createdAt: Date.now(),
    },
  ]);
  const [activeLocId, setActiveLocId] = useState('loc1');
  const [newLocName, setNewLocName] = useState('');
  const [newLocCompany, setNewLocCompany] = useState('株式会社サンプル制作');
  const [newLocProgram, setNewLocProgram] = useState('街角ドキュメント');
  const [newLicensorMode, setNewLicensorMode] = useState('both');
  const [newLocNotice, setNewLocNotice] = useState('番組「街角ドキュメント」／お問い合わせ: seiyaku@example.com');
  // 出演者向けURLはスマホから届くLANアドレスにします（file:// や localhost では届きません）
  const [qrImageBroken, setQrImageBroken] = useState(false);
  const [lanHost, setLanHost] = useState(() => {
    try {
      const saved = localStorage.getItem('demoLanHost');
      if (saved) return saved;
    } catch (e) {}
    const h = typeof window !== 'undefined' ? window.location.hostname : '';
    if (h && h !== 'localhost' && h !== '127.0.0.1') return h;
    return '192.168.11.4';
  });
  const [lanPort, setLanPort] = useState(() => {
    const p = typeof window !== 'undefined' ? window.location.port : '';
    return p || '3000';
  });
  const isFileProtocol = typeof window !== 'undefined' && window.location.protocol === 'file:';
  const isLoopbackHost = typeof window !== 'undefined' && (
    window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  );
  const needsLanOverride = isFileProtocol || isLoopbackHost;

  const performerEntryUrl = useMemo(() => {
    try {
      if (needsLanOverride) {
        const host = (lanHost || '').trim();
        const port = (lanPort || '3000').trim() || '3000';
        if (!host) return '';
        return `http://${host}:${port}/?view=input&loc=${encodeURIComponent(activeLocId)}`;
      }
      const u = new URL(window.location.href);
      u.searchParams.set('view', 'input');
      u.searchParams.set('loc', activeLocId);
      return u.toString();
    } catch (e) {
      return '';
    }
  }, [activeLocId, needsLanOverride, lanHost, lanPort]);

  // 外部APIに頼らず、画面内でQRを描画します
  const qrMountRef = useRef(null);
  useEffect(() => {
    setQrImageBroken(false);
    const el = qrMountRef.current;
    if (!el) return;
    el.innerHTML = '';
    if (!performerEntryUrl || typeof QRCode === 'undefined') {
      if (performerEntryUrl && typeof QRCode === 'undefined') setQrImageBroken(true);
      return;
    }
    try {
      new QRCode(el, {
        text: performerEntryUrl,
        width: 280,
        height: 280,
        colorDark: '#0F172A',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
    } catch (e) {
      setQrImageBroken(true);
    }
  }, [performerEntryUrl]);

  const saveLanSettings = () => {
    try {
      localStorage.setItem('demoLanHost', (lanHost || '').trim());
    } catch (e) {}
  };

  const copyPerformerUrl = async () => {
    if (!performerEntryUrl) return;
    try {
      await navigator.clipboard.writeText(performerEntryUrl);
      alert('出演者用URLをコピーしました。同じWi-Fiのスマホブラウザに貼り付けてください。');
    } catch (e) {
      prompt('このURLをスマホで開いてください', performerEntryUrl);
    }
  };

  const [searchQ, setSearchQ] = useState('');
  const [filterMode, setFilterMode] = useState('all');
  const [selectedIds, setSelectedIds] = useState([]);

  const [dbData, setDbData] = useState([
    {
      id: Date.now() - 7200000, locId: 'loc1', time: '11:48', name: '田中 花子', age: '30代',
      clothing: '白のブラウス、青のデニム',
      item1: true, item2: true, item3: true, item4: true, item5: true,
      item6: true, item7: true, item8: true, item9: true, item10: true,
      mosaic: '不要', confirmed: true, directorNote: 'OK・特記なし',
      expiresAt: Date.now() + 86400000, immutable: true,
    },
    {
      id: Date.now() - 5400000, locId: 'loc1', time: '12:05', name: '鈴木 太郎', age: '20代',
      clothing: '黒のパーカー、ベージュのズボン',
      item1: true, item2: true, item3: false, item4: true, item5: false,
      item6: true, item7: false, item8: true, item9: false, item10: true,
      mosaic: '不要', confirmed: false, directorNote: '広報・見逃し配信は不同意 → 編集で範囲確認',
      expiresAt: Date.now() + 86400000, immutable: true,
    },
    {
      id: Date.now() - 3600000, locId: 'loc1', time: '12:18', name: '佐藤 美咲', age: '40代',
      clothing: 'グレーのコート、黒のパンツ',
      item1: true, item2: true, item3: true, item4: true, item5: true,
      item6: true, item7: true, item8: true, item9: true, item10: true,
      mosaic: '顔のみ', confirmed: true, directorNote: 'モザイク要・顔のみ',
      expiresAt: Date.now() + 86400000, immutable: true,
    },
    {
      id: Date.now() - 1800000, locId: 'loc1', time: '12:41', name: '山本 健', age: '50代以上',
      clothing: '紺のジャケット、スラックス',
      item1: true, item2: false, item3: true, item4: true, item5: true,
      item6: true, item7: true, item8: true, item9: false, item10: false,
      mosaic: '全面', confirmed: false, directorNote: 'SNS・パッケージ不同意／モザイク全面 → 未確認のまま止め',
      expiresAt: Date.now() + 86400000, immutable: true,
    },
  ]);

  const [lineName, setLineName] = useState('');
  const [lineAge, setLineAge] = useState('20代');
  const [lineClothing, setLineClothing] = useState('');
  const [lineItems, setLineItems] = useState({
    item1: true, item2: true, item3: true, item4: true, item5: true,
    item6: true, item7: true, item8: true, item9: true, item10: true,
  });
  const [lineMosaicMain, setLineMosaicMain] = useState('不要');
  const [lineMosaicDetail, setLineMosaicDetail] = useState('');
  const [isSending, setIsSending] = useState(false);
  const [replyPreview, setReplyPreview] = useState(null);
  // 出演者スマホ体験用（管理UIを隠して文字を大きくします）
  const [performerMode, setPerformerMode] = useState(false);

  const activeLoc = locations.find(l => l.id === activeLocId) || locations[0];
  const plan = PLANS[selectedPlan];

  // URLパラメータで出演者入力画面を直接開く機能（QRスキャン時）
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const view = params.get('view');
    const locId = params.get('loc');
    
    if (view === 'input') {
      setActiveTab('input');
      setPerformerMode(true);
      setReplyPreview(null);
      if (locId) {
        // 該当ロケが存在すれば選択
        const targetLoc = locations.find(l => l.id === locId);
        if (targetLoc) {
          setActiveLocId(locId);
        }
      }
      // URLをクリーンアップ（履歴に残さない）
      window.history.replaceState({}, '', window.location.pathname);
    }
  }, []);

  // 残数カウンター: 当該ロケの同意送信数
  const usedCountForLoc = useMemo(() => {
    return dbData.filter(d => d.locId === activeLocId).length;
  }, [dbData, activeLocId]);

  // 残数カウンター: 全体の同意送信数（プラン上限との比較用）
  const usedCountTotal = useMemo(() => {
    return dbData.length;
  }, [dbData]);

  const remainingConsents = plan.maxConsents - usedCountTotal;

  // フルネーム判定（姓と名を半角/全角スペースで区切る）
  // 将来メモ: 現場で「スペースが分かりにくい」と言われたら、
  // ①お名前1欄＋スペース強制 ではなく、姓／名の2欄（lineFamily / lineGiven）に分ける候補。
  // いまは直さない（デモ優先）。変更時はCSV・同意ログの name 列も要確認。
  const isFullName = (name) => {
    const normalized = (name || '').trim().replace(/\u3000/g, ' ');
    const parts = normalized.split(/\s+/).filter(Boolean);
    return parts.length >= 2 && parts.every(p => p.length >= 1);
  };
  const nameOk = isFullName(lineName);

  const getUnchecked = (data) =>
    ITEMS.filter(i => !data[i.key]).map(i => i.label).join(' / ');

  const filtered = useMemo(() => {
    return dbData.filter(d => {
      if (d.locId !== activeLocId) return false;
      if (searchQ && !d.name.includes(searchQ)) return false;
      const unchecked = getUnchecked(d);
      if (filterMode === 'unchecked' && !unchecked) return false;
      if (filterMode === 'mosaic' && d.mosaic === '不要') return false;
      if (filterMode === 'unconfirmed' && d.confirmed) return false;
      return true;
    });
  }, [dbData, activeLocId, searchQ, filterMode]);

  const createLocation = () => {
    if (!newLocName.trim()) return;
    if (locations.length >= plan.maxLocs) {
      alert(`【${selectedPlan}プラン】同時ロケ上限は${plan.maxLocs}件です。プラン変更か既存ロケを閉じてください。`);
      return;
    }
    if (newLicensorMode !== 'program' && !newLocCompany.trim()) {
      alert('制作会社名を入力してください');
      return;
    }
    if (newLicensorMode !== 'company' && !newLocProgram.trim()) {
      alert('番組名を入力してください');
      return;
    }
    const id = 'loc' + Date.now();
    setLocations([...locations, {
      id,
      name: newLocName.trim(),
      licensorMode: newLicensorMode,
      companyName: newLocCompany.trim(),
      programName: newLocProgram.trim(),
      programNotice: newLocNotice.trim() || 'お問い合わせ先未設定',
      noticeText: DEFAULT_NOTICE,
      createdAt: Date.now(),
    }]);
    setActiveLocId(id);
    setNewLocName('');
  };

  // デモ用: 出演者スマホ画面を開きます（文字大きめ・管理UI非表示）
  const openInputForDemo = () => {
    setActiveTab('input');
    setPerformerMode(true);
    setReplyPreview(null);
  };

  const backToAdmin = () => {
    setPerformerMode(false);
    setActiveTab('admin');
    setReplyPreview(null);
  };

  const buildConsentText = (row) => {
    const itemsText = ITEMS.map((item, idx) =>
      `${idx + 1}. ${item.label}: ${row[item.key] ? '同意' : '未同意'}`
    ).join('\n');
    return `【撮影同意書】（送信後編集不可）\n\n${buildPreamble(activeLoc)}\n\n【ロケ】${activeLoc?.name || ''}\n【申請者】\n氏名: ${row.name}\n年代: ${row.age}\n服装: ${row.clothing}\n\n【利用許諾】\n${itemsText}\n\n【モザイク】${row.mosaic}\n【D特記】${row.directorNote || '（なし）'}\n【確認済】${row.confirmed ? 'はい' : 'いいえ'}\n\n${activeLoc?.noticeText || DEFAULT_NOTICE}\n\n※デモ: 本番は御社Driveへ自動転送後、当サーバーから24hで削除`;
  };

  const downloadOne = (row) => {
    const a = document.createElement('a');
    a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(buildConsentText(row));
    a.download = `consent_${row.name}_${row.time}.txt`;
    a.click();
  };

  const bulkDownload = () => {
    const targets = selectedIds.length
      ? filtered.filter(d => selectedIds.includes(d.id))
      : filtered;
    if (!targets.length) {
      alert('ダウンロード対象がありません');
      return;
    }

    // CSVヘッダー
    const csvHeader = ['同意日', '同意時刻', '氏名', '年代', '服装', 'モザイク', '未同意項目', 'D特記事項', '確認済'].join(',');
    
    // CSVデータ行
    const csvRows = targets.map(row => {
      const unchecked = getUnchecked(row) || 'なし（全て同意）';
      const confirmed = row.confirmed ? 'はい' : 'いいえ';
      // 同意日をフォーマット（YYYY/MM/DD）
      const dateStr = new Date(row.id).toLocaleDateString('ja-JP');
      
      // カンマを含む可能性があるフィールドはダブルクォートで囲む
      return [
        dateStr,
        row.time,
        `"${row.name}"`,
        row.age,
        `"${row.clothing}"`,
        row.mosaic,
        `"${unchecked}"`,
        `"${row.directorNote || ''}"`,
        confirmed
      ].join(',');
    });

    const csvContent = [csvHeader, ...csvRows].join('\n');
    
    // BOMを付与してExcelでの文字化けを防ぐ
    const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
    const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = `エディター引継ぎ用リスト_${activeLoc?.name || 'loc'}_${targets.length}件.csv`;
    a.click();
    URL.revokeObjectURL(url);

    alert(`✅ ${targets.length}件のエディター引継ぎ用リスト（CSV）をダウンロードしました。\n\n【デモの保存先】このPCの「ダウンロード」フォルダ\n【本番（松）】御社のGoogle Drive等へ自動転送\n【本番（梅竹）】手動DL（24h前にアラート通知）\n\n※本番では、このCSV1枚と、法的証拠となるPDFの束がセットで保存されます。エディターはこのCSVだけを見れば編集可能です。`);
  };

  const toggleSelect = (id) => {
    setSelectedIds(prev =>
      prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
    );
  };

  const toggleSelectAll = () => {
    if (selectedIds.length === filtered.length) setSelectedIds([]);
    else setSelectedIds(filtered.map(d => d.id));
  };

  const updateRow = (id, patch) => {
    setDbData(prev => prev.map(d => d.id === id ? { ...d, ...patch } : d));
  };

  const handleLineSubmit = (e) => {
    e.preventDefault();
    if (!lineName || !lineClothing) return;
    if (!isFullName(lineName)) {
      alert('お名前はフルネーム（姓と名）で、スペースを入れて入力してください。\n例: 山田 太郎');
      return;
    }
    setIsSending(true);

    setTimeout(() => {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const mosaicValue = lineMosaicMain === '要' ? lineMosaicDetail : '不要';
      const newRow = {
        id: Date.now(),
        locId: activeLocId,
        time: timeStr,
        name: lineName,
        age: lineAge,
        clothing: lineClothing,
        ...lineItems,
        mosaic: mosaicValue,
        confirmed: false,
        directorNote: '',
        expiresAt: Date.now() + 86400000,
        immutable: true,
      };
      setDbData([newRow, ...dbData]);
      setIsSending(false);

      const itemsSummary = ITEMS.map(i =>
        `・${i.label}: ${newRow[i.key] ? '同意' : '未同意'}`
      ).join('\n');

      setReplyPreview({
        title: selectedPlan === '松' ? '📩 LINE自動返信（松プラン）' : '📩 送信控え（梅・竹は画面内表示）',
        body: `${buildPreamble(activeLoc)}\n\n【ご入力内容の控え】（編集不可）\n氏名: ${newRow.name}\n年代: ${newRow.age}\n服装: ${newRow.clothing}\nモザイク: ${newRow.mosaic}\n\n【同意状況】\n${itemsSummary}\n\n【番組告知・お問い合わせ】\n${activeLoc.programNotice}\n\n${activeLoc.noticeText}`,
      });

                          value={lineAge}
                          onChange={e => setLineAge(e.target.value)}
                          className="performer-input w-full bg-[#0F172A] border border-slate-600 rounded-xl px-4 mt-2"
                        >
                          <option>10代</option><option>20代</option><option>30代</option><option>40代</option><option>50代以上</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-base text-slate-300 font-bold pf-label">③ 本日の服装 *</label>
                        <input
                          required
                          value={lineClothing}
                          onChange={e => setLineClothing(e.target.value)}
                          placeholder="赤のTシャツなど"
                          className="performer-input w-full bg-[#0F172A] border border-slate-600 rounded-xl px-4 mt-2"
                        />
                      </div>
                      <div>
                        <label className="text-base text-slate-300 font-bold pf-label">④ ご同意項目（デフォルト全て）</label>
                        <div className="pf-items space-y-3 mt-3 bg-[#0F172A] p-3 rounded-xl">
                          {ITEMS.map(item => (
                            <label key={item.key} className="flex gap-4 items-start p-3 rounded-xl active:bg-slate-800">
                              <input
                                type="checkbox"
                                checked={lineItems[item.key]}
                                onChange={e => setLineItems({ ...lineItems, [item.key]: e.target.checked })}
                                className="performer-check accent-[#06C755]"
                              />
                              <span className="text-base text-slate-200 leading-relaxed pf-item">{item.label}</span>
                            </label>
                          ))}
                        </div>
                      </div>
                      <div>
                        <label className="text-base text-slate-300 font-bold pf-label">⑤ モザイク</label>
                        <div className="flex gap-3 mt-3">
                          {['不要', '要'].map(m => (
                            <button key={m} type="button"
                              onClick={() => { setLineMosaicMain(m); if (m === '不要') setLineMosaicDetail(''); }}
                              className={`flex-1 py-5 rounded-xl text-lg font-bold border pf-btn ${
                                lineMosaicMain === m ? 'border-[#06C755] text-[#06C755] bg-[#06C755]/10' : 'border-slate-600 text-slate-400'
                              }`}>{m}</button>
                          ))}
                        </div>
                        {lineMosaicMain === '要' && (
                          <div className="flex gap-3 mt-3">
                            {['顔のみ', '全面'].map(d => (
                              <button key={d} type="button" onClick={() => setLineMosaicDetail(d)}
                                className={`flex-1 py-5 rounded-xl text-lg font-bold border pf-btn ${
                                  lineMosaicDetail === d ? 'border-rose-500 text-rose-400' : 'border-slate-600 text-slate-400'
                                }`}>{d}</button>
                            ))}
                          </div>
                        )}
                      </div>
                      <button
                        type="submit"
                        disabled={isSending || !nameOk || !lineClothing || (lineMosaicMain === '要' && !lineMosaicDetail) || remainingConsents <= 0}
                        className={`w-full py-5 rounded-xl font-bold text-lg text-white pf-btn ${
                          isSending || !nameOk || !lineClothing || (lineMosaicMain === '要' && !lineMosaicDetail) || remainingConsents <= 0
                            ? 'bg-slate-700 cursor-not-allowed' : 'bg-[#06C755] hover:bg-[#05b34c]'
                        }`}
                      >
                        {remainingConsents <= 0
                          ? '枠上限のため送信できません'
                          : !nameOk
                            ? 'フルネームを入力してください'
                            : isSending
                              ? '送信中...'
                              : '同意して送信'}
                      </button>
                      <p className="text-base text-slate-500 text-center pf-hint">送信後は内容を変更できません。控えと注意文が自動返信されます。</p>
                    </form>
                  </>
                )}
              </div>
            </div>
          </div>
        )}
      </div>

      {!performerMode && (
        <div className="py-4 text-center text-[10px] text-slate-500 border-t border-slate-800">
          AI撮影許諾エージェント 管理仕様デモ v0.7｜連絡先非取得明記｜AI映像制作部・中流
        </div>
      )}
    </div>
  );
};

ReactDOM.render(<ConsentSystemDemo />, document.getElementById('root'));
  </script>
</body>
</html>
